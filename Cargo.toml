[workspace]
resolver = "2"
members = [".", "./wasm"]

[package]
name = "orgize-ng"
version = "0.10.0-alpha.10"
authors = [
  "PoiScript <poiscript@gmail.com>",
  "Sebastián Zaffarano <sebas@zaffarano.com.ar>",
]
repository = "https://github.com/szaffarano/orgize"
edition = "2021"
license = "MIT"
description = "A Rust library for parsing org-mode files (maintained fork of orgize)."
readme = "README.md"
keywords = ["orgmode", "org-mode", "emacs", "parser"]

[lib]
name = "orgize"

[package.metadata.docs.rs]
all-features = true

[features]
default = []
indexmap = ["dep:indexmap"]
datetime = ["dep:jiff"]
tracing = ["dep:tracing"]
syntax-org-fc = []

[dependencies]
bytecount = "0.6"
cfg-if = "1.0.0"
indexmap = { version = "2.1", optional = true }
jiff = { version = "1.0.1", optional = true, default-features = false, features = [
  "std",
] }
jetscii = "0.5"
memchr = "2.5"
nom = { version = "8.0", default-features = false, features = ["std"] }
rowan = "0.17"
tracing = { version = "0.1", optional = true }

[dev-dependencies]
criterion = "0.8"
insta = "1.29"
slugify = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[[bench]]
name = "parse"
harness = false

[[example]]
name = "parse"
required-features = ["tracing"]

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
