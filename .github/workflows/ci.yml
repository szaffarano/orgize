name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - run: |
          cargo fmt -- --check
          cargo test --all-features

  clippy:
    name: Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Linting
        # Benches are excluded: their .org input files are gitignored, so
        # `--all-targets` can't compile the bench harness in CI.
        run: cargo clippy --lib --tests --examples --all-features -- -D warnings

  corpus:
    name: Corpus round-trip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch org-mode and Worg
        run: scripts/fetch-corpus.sh

      - name: Round-trip
        run: cargo test --all-features --test corpus -- --ignored
        env:
          ORGIZE_CORPUS: target/corpus

  gh-pages:
    if: github.ref == 'refs/heads/v0.10'

    permissions:
      contents: read
      pages: write
      id-token: write

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build
        run: wasm-pack build -t web -d ./dist --out-name orgize ./wasm/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./wasm"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
